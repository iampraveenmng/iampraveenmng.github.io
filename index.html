<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Task Tracker</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- SortableJS for drag-and-drop functionality -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    
    <!-- Canvas-confetti for the celebration animation -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* Custom styles to enhance the look and feel */
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            /* Background image with a semi-transparent overlay for readability */
            background-image: 
                linear-gradient(rgba(248, 250, 252, 0.85), rgba(248, 250, 252, 0.85)),
                url('https://images.unsplash.com/photo-1557683316-973673baf926?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* Styling for the scrollbar */
        .tasks-container::-webkit-scrollbar { width: 8px; }
        .tasks-container::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 10px; }
        .tasks-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .tasks-container::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Drag-and-drop styles */
        .sortable-ghost { background: #e0f2fe; border: 2px dashed #0ea5e9; opacity: 0.7; }
        .sortable-drag { opacity: 1 !important; transform: rotate(4deg); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); }
    </style>
</head>
<body class="text-slate-800">

    <div class="container mx-auto p-4 sm:p-6 lg:p-8">
        
        <!-- Header Section -->
        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold text-slate-900">My Kanban Board</h1>
            <p class="text-slate-600 mt-2">Drag and drop tasks to organize your workflow.</p>
        </header>

        <!-- Action Buttons -->
        <div class="flex justify-center items-center gap-4 mb-8">
            <button id="addTaskBtn" class="bg-blue-600 text-white font-semibold py-3 px-6 rounded-lg shadow-md hover:bg-blue-700 transition-all duration-300 transform hover:scale-105 flex items-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" /></svg>
                Add New Task
            </button>
        </div>

        <!-- Kanban Board -->
        <div id="kanban-board" class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- To Do Column -->
            <div class="bg-white/70 backdrop-blur-sm rounded-xl shadow-lg" data-status="todo">
                <div class="p-4 border-b border-slate-200 flex justify-between items-center">
                    <h2 class="text-lg font-bold text-slate-800 flex items-center">
                        <span class="w-3 h-3 bg-red-400 rounded-full mr-3"></span>
                        To Do
                    </h2>
                    <span id="todo-percent" class="text-sm font-bold text-slate-500">0%</span>
                </div>
                <div id="todo-tasks" class="tasks-container p-4 min-h-[200px] max-h-[60vh] overflow-y-auto"></div>
            </div>

            <!-- In Progress Column -->
            <div class="bg-white/70 backdrop-blur-sm rounded-xl shadow-lg" data-status="inprogress">
                <div class="p-4 border-b border-slate-200 flex justify-between items-center">
                    <h2 class="text-lg font-bold text-slate-800 flex items-center"><span class="w-3 h-3 bg-yellow-400 rounded-full mr-3"></span>In Progress</h2>
                    <span id="inprogress-percent" class="text-sm font-bold text-slate-500">0%</span>
                </div>
                <div id="inprogress-tasks" class="tasks-container p-4 min-h-[200px] max-h-[60vh] overflow-y-auto"></div>
            </div>

            <!-- Done Column -->
            <div class="bg-white/70 backdrop-blur-sm rounded-xl shadow-lg" data-status="done">
                <div class="p-4 border-b border-slate-200 flex justify-between items-center">
                    <h2 class="text-lg font-bold text-slate-800 flex items-center"><span class="w-3 h-3 bg-green-400 rounded-full mr-3"></span>Done</h2>
                    <span id="done-percent" class="text-sm font-bold text-slate-500">0%</span>
                </div>
                <div id="done-tasks" class="tasks-container p-4 min-h-[200px] max-h-[60vh] overflow-y-auto"></div>
            </div>
        </div>
    </div>

    <!-- Add Task Modal -->
    <div id="taskModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 hidden transition-opacity duration-300">
        <div class="bg-white rounded-lg shadow-2xl p-6 w-full max-w-md transform transition-all duration-300 scale-95">
            <h3 class="text-xl font-bold mb-4">Create a New Task</h3>
            <form id="taskForm">
                <textarea id="taskInput" class="w-full border-slate-300 rounded-md p-3 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition" rows="4" placeholder="What do you need to do?" required></textarea>
                <div class="mt-6 flex justify-end space-x-3">
                    <button type="button" id="cancelBtn" class="px-4 py-2 bg-slate-100 text-slate-700 rounded-md hover:bg-slate-200 transition">Cancel</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white font-semibold rounded-md hover:bg-blue-700 transition">Add Task</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // DOM Elements
            const taskModal = document.getElementById('taskModal');
            const addTaskBtn = document.getElementById('addTaskBtn');
            const cancelBtn = document.getElementById('cancelBtn');
            const taskForm = document.getElementById('taskForm');
            const taskInput = document.getElementById('taskInput');
            const todoTasks = document.getElementById('todo-tasks');
            const inprogressTasks = document.getElementById('inprogress-tasks');
            const doneTasks = document.getElementById('done-tasks');
            const todoPercentEl = document.getElementById('todo-percent');
            const inprogressPercentEl = document.getElementById('inprogress-percent');
            const donePercentEl = document.getElementById('done-percent');

            // --- State Management ---
            let tasks = JSON.parse(localStorage.getItem('tasks')) || [
                { id: `task-${Date.now()}-1`, text: 'Design the user interface mockups', status: 'todo' },
                { id: `task-${Date.now()}-2`, text: 'Develop the main application logic', status: 'inprogress' },
                { id: `task-${Date.now()}-3`, text: 'Set up the project repository', status: 'done' },
            ];
            const saveTasks = () => localStorage.setItem('tasks', JSON.stringify(tasks));

            // --- Task & Percentage Rendering ---
            const renderTasks = () => {
                // Clear existing tasks from columns
                todoTasks.innerHTML = '';
                inprogressTasks.innerHTML = '';
                doneTasks.innerHTML = '';
                
                // Calculate percentages
                const totalTasks = tasks.length;
                const todoCount = tasks.filter(t => t.status === 'todo').length;
                const inprogressCount = tasks.filter(t => t.status === 'inprogress').length;
                const doneCount = tasks.filter(t => t.status === 'done').length;

                todoPercentEl.textContent = totalTasks > 0 ? `${Math.round((todoCount / totalTasks) * 100)}%` : '0%';
                inprogressPercentEl.textContent = totalTasks > 0 ? `${Math.round((inprogressCount / totalTasks) * 100)}%` : '0%';
                donePercentEl.textContent = totalTasks > 0 ? `${Math.round((doneCount / totalTasks) * 100)}%` : '0%';

                // Render tasks
                tasks.forEach(task => {
                    const taskElement = createTaskElement(task);
                    if (task.status === 'todo') todoTasks.appendChild(taskElement);
                    else if (task.status === 'inprogress') inprogressTasks.appendChild(taskElement);
                    else doneTasks.appendChild(taskElement);
                });
            };

            const createTaskElement = (task) => {
                const div = document.createElement('div');
                div.id = task.id;
                div.className = 'task-card bg-slate-50 p-3 rounded-lg border border-slate-200 mb-3 cursor-grab active:cursor-grabbing shadow-sm hover:shadow-md transition-shadow';
                
                const contentWrapper = document.createElement('div');
                contentWrapper.className = 'flex justify-between items-start';

                const p = document.createElement('p');
                p.className = 'text-slate-700 mr-4 flex-1';
                p.textContent = task.text;
                
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'text-slate-400 hover:text-red-500 transition-colors p-1';
                deleteBtn.innerHTML = '&times;';
                deleteBtn.title = 'Delete task';
                deleteBtn.onclick = () => deleteTask(task.id);

                contentWrapper.appendChild(p);
                contentWrapper.appendChild(deleteBtn);
                div.appendChild(contentWrapper);
                return div;
            };

            // --- Task Operations ---
            const addTask = (text) => {
                const newTask = { id: `task-${Date.now()}`, text, status: 'todo' };
                tasks.push(newTask);
                saveTasks();
                renderTasks();
            };
            const deleteTask = (taskId) => {
                tasks = tasks.filter(task => task.id !== taskId);
                saveTasks();
                renderTasks();
            };
            const updateTaskStatus = (taskId, newStatus) => {
                const task = tasks.find(t => t.id === taskId);
                if (task) {
                    const oldStatus = task.status;
                    task.status = newStatus;
                    saveTasks();
                    if (newStatus === 'done' && oldStatus !== 'done') triggerCelebration();
                    renderTasks(); // Re-render to update percentages
                }
            };

            // --- Modal Handling ---
            const openModal = () => {
                taskModal.classList.remove('hidden');
                setTimeout(() => {
                    taskModal.classList.add('opacity-100');
                    taskModal.querySelector('div').classList.remove('scale-95');
                    taskInput.focus();
                }, 10);
            };

            const closeModal = () => {
                taskModal.classList.remove('opacity-100');
                taskModal.querySelector('div').classList.add('scale-95');
                setTimeout(() => {
                    taskModal.classList.add('hidden');
                    taskForm.reset();
                }, 300);
            };

            // --- Celebration Effects (Confetti and Sound) ---
            let audioCtx;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            } catch (e) {
                console.error("Web Audio API is not supported in this browser.");
            }

            const playClappingSound = () => {
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                if (!audioCtx) return;

                const clapCount = 15;
                const duration = 0.5;

                for (let i = 0; i < clapCount; i++) {
                    const bufferSize = audioCtx.sampleRate * 0.1;
                    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                    const output = buffer.getChannelData(0);
                    for (let j = 0; j < bufferSize; j++) {
                        output[j] = Math.random() * 2 - 1; // Generate white noise
                    }

                    const whiteNoiseSource = audioCtx.createBufferSource();
                    whiteNoiseSource.buffer = buffer;

                    const gainNode = audioCtx.createGain();
                    const now = audioCtx.currentTime;
                    const startTime = now + Math.random() * (duration - 0.1);

                    gainNode.gain.setValueAtTime(0, startTime);
                    gainNode.gain.linearRampToValueAtTime(0.8, startTime + 0.01); // Quick attack
                    gainNode.gain.exponentialRampToValueAtTime(0.01, startTime + 0.1); // Quick decay

                    whiteNoiseSource.connect(gainNode);
                    gainNode.connect(audioCtx.destination);
                    whiteNoiseSource.start(startTime);
                }
            };

            const triggerCelebration = () => {
                playClappingSound();

                const duration = 3 * 1000, animationEnd = Date.now() + duration;
                const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 100 };
                const randomInRange = (min, max) => Math.random() * (max - min) + min;
                
                const interval = setInterval(() => {
                    const timeLeft = animationEnd - Date.now();
                    if (timeLeft <= 0) return clearInterval(interval);
                    const particleCount = 50 * (timeLeft / duration);
                    confetti({ ...defaults, particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } });
                    confetti({ ...defaults, particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } });
                }, 250);
            };

            // --- Event Listeners ---
            addTaskBtn.addEventListener('click', openModal);
            cancelBtn.addEventListener('click', closeModal);
            taskModal.addEventListener('click', (e) => { if (e.target === taskModal) closeModal(); });
            taskForm.addEventListener('submit', (e) => {
                e.preventDefault();
                if (taskInput.value.trim()) {
                    addTask(taskInput.value.trim());
                    closeModal();
                }
            });

            // --- Initialize SortableJS ---
            [todoTasks, inprogressTasks, doneTasks].forEach(el => {
                new Sortable(el, {
                    group: 'tasks', animation: 150, ghostClass: 'sortable-ghost', dragClass: 'sortable-drag',
                    onEnd: (evt) => {
                        const taskId = evt.item.id;
                        const newStatus = evt.to.parentElement.dataset.status;
                        updateTaskStatus(taskId, newStatus);
                    }
                });
            });

            // Initial Render
            renderTasks();
        });
    </script>

</body>
</html>
